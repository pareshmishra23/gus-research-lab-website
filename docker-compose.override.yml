# ==============================================================================
# LOCAL DEVELOPMENT DOCKER COMPOSE OVERRIDE (For local Mac testing)
# In production on Oracle VM, do not include this file, or run:
#   docker compose -f docker-compose.yml up -d --build
# ==============================================================================

services:
  # Host port mappings for direct debugging (uses alternate ports to avoid collisions with host services like Camel/ADK on 8080)
  backend:
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-8085}:8080"

  postgres:
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
