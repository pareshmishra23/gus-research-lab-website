# ==============================================================================
# ORACLE CLOUD HOST NGINX CONFIGURATION SNIPPET
# Place this configuration in /etc/nginx/sites-available/gusresearchlab.conf
# or add it to your existing host Nginx configuration.
#
# Target Mapping:
#   https://gusresearchlab.is-a.bot     --> 127.0.0.1:8081 (GUS Docker Frontend)
#   https://kundali.gusresearchlab.is-a.bot --> 127.0.0.1:7860 (Existing Kundali Service)
# ==============================================================================

server {
    listen 80;
    server_name gusresearchlab.is-a.bot;

    # Certbot challenge directory for Let's Encrypt SSL
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Redirect all HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name gusresearchlab.is-a.bot;

    # SSL Certificate Paths (Managed via host Certbot)
    # ssl_certificate /etc/letsencrypt/live/gusresearchlab.is-a.bot/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/gusresearchlab.is-a.bot/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name kundali.gusresearchlab.is-a.bot;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name kundali.gusresearchlab.is-a.bot;

    # SSL Certificate Paths (Managed via host Certbot)
    # ssl_certificate /etc/letsencrypt/live/kundali.gusresearchlab.is-a.bot/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/kundali.gusresearchlab.is-a.bot/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://127.0.0.1:7860;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
