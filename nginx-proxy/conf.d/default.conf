# ==============================================================================
# ORACLE CLOUD PRODUCTION NGINX REVERSE PROXY CONFIGURATION
# Domains:
# - gusresearchlab.is-a.bot -> Frontend (frontend:80) & Backend API (backend:8080)
# - kundali.gusresearchlab.is-a.bot -> Kundali App (kundali:8001)
# ==============================================================================

# ------------------------------------------------------------------------------
# HTTP (Port 80) — Let's Encrypt ACME Challenge & Global HTTPS Redirect
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name gusresearchlab.is-a.bot kundali.gusresearchlab.is-a.bot localhost;

    # Certbot ACME Challenge Path
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Redirect all HTTP traffic to HTTPS (Except ACME challenge)
    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# HTTPS (Port 443) — GUS Research Lab (gusresearchlab.is-a.bot)
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name gusresearchlab.is-a.bot;

    # SSL Certificates (Managed via Certbot)
    ssl_certificate /etc/letsencrypt/live/gusresearchlab.is-a.bot/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gusresearchlab.is-a.bot/privkey.pem;

    # SSL Hardening Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_timeout 1d;
    ssl_session_cache shared:GUS_SSL:10m;
    ssl_session_tickets off;

    # Proxy Headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Frontend Single Page App (Vite/React via frontend Nginx container)
    location / {
        proxy_pass http://frontend:80;
    }

    # Spring Boot REST API
    location /api {
        proxy_pass http://backend:8080/api;
        proxy_read_timeout 90s;
        proxy_connect_timeout 90s;
    }

    # Spring Boot Actuator Health Check
    location /actuator {
        proxy_pass http://backend:8080/actuator;
    }
}

# ------------------------------------------------------------------------------
# HTTPS (Port 443) — Kundali App (kundali.gusresearchlab.is-a.bot)
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name kundali.gusresearchlab.is-a.bot;

    # SSL Certificates (Managed via Certbot)
    ssl_certificate /etc/letsencrypt/live/kundali.gusresearchlab.is-a.bot/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kundali.gusresearchlab.is-a.bot/privkey.pem;

    # SSL Hardening Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Proxy Headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Kundali Application (internal port 8001)
    location / {
        proxy_pass http://kundali:8001;
        proxy_read_timeout 90s;
        proxy_connect_timeout 90s;
    }
}
