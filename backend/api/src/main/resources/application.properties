spring.application.name=gus-lab-api
server.port=${SERVER_PORT:8080}

# Spring DataSource
# Defaults to PostgreSQL for Oracle Cloud Production deployment.
# Can be overridden via SPRING_DATASOURCE_URL for H2 (Samsung M31 / local fallback) or custom databases.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/guslab}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgrespassword}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.postgresql.Driver}

# H2 Console (available when running H2)
spring.h2.console.enabled=${SPRING_H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console

# Connection Pooling (HikariCP)
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=${SPRING_JPA_DIALECT:org.hibernate.dialect.PostgreSQLDialect}

# JWT Secret and Expiration Configuration
guslab.app.jwtSecret=${JWT_SECRET:GusResearchLabSuperSecretKeyThatIsAtLeast256BitsLongForSecurityJWTSigning2026*}
guslab.app.jwtExpirationMs=${JWT_EXPIRATION_MS:86400000}

# CORS Allowed Origins
guslab.app.corsAllowedOrigins=${CORS_ALLOWED_ORIGINS:https://gusresearchlab.is-a.bot,https://kundali.gusresearchlab.is-a.bot,http://localhost:5173,http://localhost:80,http://localhost,http://127.0.0.1:5173,http://127.0.0.1}

# Spring Boot Actuator Endpoints
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
